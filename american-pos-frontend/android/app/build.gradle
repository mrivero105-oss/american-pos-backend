apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.isaacpos.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.isaacpos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 240406
        versionName "24.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.apk'
        }
    }
    signingConfigs {
        release {
            def ksFilePath = keystoreProperties['storeFile'] ?: System.getenv('KEYSTORE_FILE') ?: 'isaacpos-release-key.jks'
            def ksStorePass = keystoreProperties['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD') ?: ''
            def ksKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('KEY_ALIAS') ?: 'isaacpos'
            def ksKeyPass = keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD') ?: ''
            def isReleaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') && !it.toLowerCase().contains('lint') }
            if (isReleaseTaskRequested) {
                def resolvedKs = file(ksFilePath)
                if (!resolvedKs.exists() || !ksStorePass || !ksKeyPass) {
                    throw new GradleException("Faltan credenciales de firma release (keystore.properties o KEYSTORE_PASSWORD/KEY_PASSWORD) o el archivo keystore no existe: ${resolvedKs.path}")
                }
            }
            storeFile file(ksFilePath)
            storePassword ksStorePass
            keyAlias ksKeyAlias
            keyPassword ksKeyPass
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        debug {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
    androidTestImplementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
    implementation "com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1"
    def cameraxVersion = "1.4.2"
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
