<!DOCTYPE html>
<html lang="es" style="background-color: #030712;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>American POS - Cargando</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #030712;
      color: #f3f4f6;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .ambient-glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .ambient-glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem 4rem;
      border-radius: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 10;
      max-width: 440px;
      width: 90%;
      text-align: center;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 2rem;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      animation: pulse-icon 2s infinite ease-in-out;
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(124, 58, 237, 0.6); }
    }
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.75rem;
      font-weight: 700;
      color: #3b82f6;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: -1.25rem;
    }
    .loader-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #2563eb, #10b981);
      border-radius: 999px;
      animation: shimmer 1.4s infinite ease-in-out;
    }
    @keyframes shimmer {
      0% { left: -40%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
    .status-text {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="card">
    <div class="brand-icon">A</div>
    <div>
      <h1 class="title">American POS</h1>
      <p class="subtitle">Motor Flash v2.2</p>
    </div>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
    <p class="status-text">Inicializando base de datos local y servicios...</p>
  </div>
</body>
</html>
