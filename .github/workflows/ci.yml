name: Isaac POS CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  frontend-lint-and-build:
    name: Frontend Lint, Unit & Bundle Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: american-pos-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: american-pos-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint strict checks
        run: |
          npx eslint . --max-warnings=0
          npx eslint src -c eslint.undef-check.config.js

      - name: Run frontend Vitest unit & component suite
        run: npm run test:unit

      - name: Run frontend UnifiedDB functional verification
        run: node tests/test_unified_db.cjs

      - name: Build production Desktop (Chrome 130+) & Mobile (Android WebView) bundles
        # Permite empaquetar dist.zip sin llave privada RSA OTA en runners de CI (producción sigue exigiendo firma RSA-SHA256)
        env:
          ALLOW_UNSIGNED_OTA_DEV: 'true'
        run: |
          npm run build
          npm run build:mobile

      - name: Verify built entry chunk budgets (< 350 KB desktop, < 400 KB mobile)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const assetsDir = path.resolve('dist/assets');
            const entry = fs.readdirSync(assetsDir).find(f => /^index-.*\.js$/.test(f));
            if (!entry) throw new Error('Missing built index entry bundle');
            const sizeKb = fs.statSync(path.join(assetsDir, entry)).size / 1024;
            console.log('Desktop entry chunk:', entry, sizeKb.toFixed(2), 'KB');
            if (sizeKb >= 350) throw new Error('Desktop entry chunk exceeded 350 KB limit: ' + sizeKb.toFixed(2));

            const mobileAssets = path.resolve('dist-mobile/assets');
            const mobileEntry = fs.readdirSync(mobileAssets).find(f => /^index-.*\.js$/.test(f));
            if (!mobileEntry) throw new Error('Missing built mobile index entry bundle');
            const mobileKb = fs.statSync(path.join(mobileAssets, mobileEntry)).size / 1024;
            console.log('Mobile entry chunk:', mobileEntry, mobileKb.toFixed(2), 'KB');
            if (mobileKb >= 400) throw new Error('Mobile entry chunk exceeded 400 KB limit: ' + mobileKb.toFixed(2));
          "

      - name: Upload built frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            american-pos-frontend/dist
            american-pos-frontend/dist-mobile
            american-pos-backend/public
          retention-days: 3

  backend-tests-postgres:
    name: Backend Integrity, Security & Integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg16_ephemeral_password
          POSTGRES_DB: americanpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ISAAC_TEST_ISOLATED: '1'
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: ci_pg16_ephemeral_password
      DB_NAME_FORCE: americanpos_test
      DISABLE_BACKGROUND_WORKERS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            american-pos-backend/package-lock.json
            american-pos-frontend/package-lock.json
            cloud_license_server/node-server/package-lock.json

      - name: Install backend, license gateway & test client dependencies
        run: |
          npm --prefix american-pos-backend ci
          npm --prefix american-pos-frontend ci
          npm --prefix cloud_license_server/node-server ci

      - name: Generate ephemeral CI test secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "LEGACY_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "SYNC_SECRET_KEY=$(openssl rand -hex 32)"
            echo "BACKUP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "AUDIT_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "OWNER_SECRET_KEY=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Run Vortex Math & Legacy Security/Auth suites
        working-directory: american-pos-backend
        run: |
          node test_vortex_engine.js
          node tests/test_security_audit_remediation.js
          node tests/test_auth_security.js

      - name: Run Blocks 1-4 & PosIntegrity unit/integration tests
        working-directory: american-pos-backend
        run: |
          node --test \
            tests/test_block1_security_fixes.test.mjs \
            tests/test_block1_integrity_remediation.test.mjs \
            tests/test_block2_financial_integrity.test.mjs \
            tests/test_block3_associations_and_routes.test.mjs \
            tests/test_block4_offline_sync_and_resilience.test.mjs \
            tests/pos-integrity.test.mjs

      - name: Run Real Express + PG16 + Socket.IO, Security Hardening, Regressions & Online Licensing E2E
        working-directory: american-pos-backend
        # Secuencial (--test-concurrency=1) porque las suites E2E comparten la BD americanpos_test y el machineId del runner (licencias/turnos/DDL inicial)
        run: |
          node --check ../cloud_license_server/node-server/server.js
          node --check ../cloud_license_server/node-server/licenseStore.js
          node --test --test-concurrency=1 \
            tests/test_mobile_audit_remediation.test.mjs \
            tests/test_cloud_isolation_level2.test.mjs \
            tests/test_e2e_api_and_socket.test.mjs \
            tests/test_block2_security_hardening.test.mjs \
            tests/test_audit_remediation_regressions.test.mjs \
            tests/test_phase1_security_and_integrity.test.mjs \
            tests/test_performance_999_pillars.test.mjs \
            tests/test_online_licensing.test.mjs \
            tests/test_hardening_10_of_10.test.mjs \
            tests/test_phase3_modern_stack.test.mjs

  android-native-ci:
    name: Android Native CI (Capacitor Sync, JUnit, LintRelease & Debug APK)
    runs-on: ubuntu-latest
    needs: [frontend-lint-and-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: american-pos-frontend/package-lock.json

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK (accept licenses & ensure API 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore built frontend assets (including dist-mobile)
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Install frontend dependencies & sync Capacitor Android
        working-directory: american-pos-frontend
        run: |
          npm ci
          npx cap sync android

      - name: Run Android JUnit, LintRelease & Debug APK compilation
        working-directory: american-pos-frontend/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleDebug --no-daemon

  e2e-playwright:
    name: Full-Stack Real Browser E2E (Playwright + PG16)
    runs-on: ubuntu-latest
    needs: [frontend-lint-and-build, backend-tests-postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg16_ephemeral_password
          POSTGRES_DB: americanpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ISAAC_TEST_ISOLATED: '1'
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: ci_pg16_ephemeral_password
      DB_NAME_FORCE: americanpos_test
      DISABLE_BACKGROUND_WORKERS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: american-pos-backend/package-lock.json

      - name: Restore built frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Install backend, frontend & license gateway dependencies
        run: |
          npm --prefix american-pos-backend ci
          npm --prefix american-pos-frontend ci
          npm --prefix cloud_license_server/node-server ci

      - name: Install Playwright Chromium browser
        working-directory: american-pos-frontend
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral CI test secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "LEGACY_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "SYNC_SECRET_KEY=$(openssl rand -hex 32)"
            echo "BACKUP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "AUDIT_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "OWNER_SECRET_KEY=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Run Playwright Real UI E2E suite
        working-directory: american-pos-frontend
        run: npx playwright test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: american-pos-frontend/test-results
          retention-days: 3

  windows-modern-packaging-check:
    name: Windows Modern Electron 45 (7/7 Fuses + mobile-ota) & Scripts Verification
    runs-on: windows-latest
    needs: [frontend-lint-and-build, backend-tests-postgres]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: american-pos-backend/package-lock.json

      - name: Restore built frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Validate PowerShell build scripts AST syntax
        shell: pwsh
        run: |
          $scripts = @(
            'compilar_todo.ps1',
            'compilar_instalador_win7_8.ps1',
            'compilar_instalador_moderno_win10_11.ps1',
            'american-pos-backend/build_legacy.ps1',
            'american-pos-backend/build_release.ps1',
            'build_ultra/sync_and_compile.ps1',
            'build_ultra/compilar_ambos_instaladores.ps1'
          )
          foreach ($s in $scripts) {
            if (Test-Path $s) {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s), [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                throw "PowerShell syntax errors in $s : $($errors | Out-String)"
              }
              Write-Host "AST OK: $s"
            }
          }

      - name: Install backend dependencies
        working-directory: american-pos-backend
        run: npm ci

      - name: Verify Electron 45 Modern (Win10/11 + 7/7 Fuses + mobile-ota) unpacked build
        working-directory: american-pos-backend
        run: |
          npm run pack:modern
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            const dir = 'dist_modern/win-unpacked';
            const res = fs.readdirSync(dir + '/resources');
            if (!res.includes('app.asar')) throw new Error('Missing app.asar in ' + dir);
            if (res.some(f => f.startsWith('.env'))) throw new Error('Secret leak .env in ' + dir);
            const otaDir = path.join(dir, 'resources', 'mobile-ota');
            if (!fs.existsSync(path.join(otaDir, 'dist.zip')) || !fs.existsSync(path.join(otaDir, 'version.json'))) {
              throw new Error('Missing mobile-ota extraResources (dist.zip / version.json) in ' + otaDir);
            }
            console.log('Verified clean unpacked Modern build + mobile-ota:', dir);
            (async () => {
              const fusesMod = await import(pathToFileURL(path.resolve('node_modules/@electron/fuses/dist/index.js')).href);
              const wire = await fusesMod.getCurrentFuseWire(path.resolve('dist_modern/win-unpacked/Isaac POS.exe'));
              const { FuseV1Options, FuseState } = fusesMod;
              const checks = [
                ['RunAsNode', FuseState.DISABLE],
                ['EnableCookieEncryption', FuseState.ENABLE],
                ['EnableNodeOptionsEnvironmentVariable', FuseState.DISABLE],
                ['EnableNodeCliInspectArguments', FuseState.DISABLE],
                ['EnableEmbeddedAsarIntegrityValidation', FuseState.ENABLE],
                ['OnlyLoadAppFromAsar', FuseState.ENABLE],
                ['GrantFileProtocolExtraPrivileges', FuseState.DISABLE]
              ];
              for (const [name, expected] of checks) {
                if (wire[FuseV1Options[name]] !== expected) {
                  throw new Error('Unexpected Electron fuse state for ' + name);
                }
              }
              console.log('Verified Electron 45 Modern 7/7 security fuses.');
            })().catch((e) => { console.error(e); process.exit(1); });
          "
