<!DOCTYPE html>
<html lang="es" style="background-color: #030712;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isaac POS - Iniciando</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #030712;
      color: #f3f4f6;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .ambient-glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .ambient-glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      padding: 2.5rem 3rem;
      border-radius: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      z-index: 10;
      max-width: 380px;
      width: 90%;
      text-align: center;
    }
    .logo-container {
      padding: 1rem 1.5rem;
      border-radius: 0.75rem;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(30, 41, 59, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.4);
    }
    .logo-container img {
      height: 52px;
      width: auto;
      max-width: 250px;
      object-fit: contain;
      filter: brightness(1.08) drop-shadow(0 2px 14px rgba(0, 229, 255, 0.32));
    }
    .loader-bar {
      width: 100%;
      height: 6px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #6366f1, #10b981);
      border-radius: 999px;
      animation: shimmer 1.5s infinite ease-in-out;
    }
    @keyframes shimmer {
      0% { left: -40%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
    .status-text {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.025em;
    }
  </style>
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="card">
    <div class="logo-container">
      <img 
        src="isaac-logo-horizontal-dark.png" 
        alt="Isaac POS" 
        onerror="if(this.src.indexOf('isaac-emblem-dark.png')===-1){this.src='isaac-emblem-dark.png';}else if(this.src.indexOf('assets/icon.png')===-1){this.src='assets/icon.png';}"
      />
    </div>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
    <p class="status-text">Iniciando motor Isaac POS y base de datos local...</p>
  </div>
</body>
</html>
